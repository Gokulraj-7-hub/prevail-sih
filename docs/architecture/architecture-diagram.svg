<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
    <style>
      .box { fill:#eef4fb; stroke:#4472a8; stroke-width:1.5; rx:8; }
      .box-model { fill:#eaf7f0; stroke:#2f9e5c; stroke-width:1.5; rx:8; }
      .box-ext { fill:#fdf1e6; stroke:#c9781f; stroke-width:1.5; rx:8; }
      .box-product { fill:#f3eefc; stroke:#7d4fd6; stroke-width:1.5; rx:8; }
      .lbl { font-size:13px; fill:#1c2733; text-anchor:middle; }
      .sub { font-size:10px; fill:#5b6673; text-anchor:middle; }
      .edge { stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .section { font-size:12px; fill:#8a94a1; font-weight:600; letter-spacing:0.5px; }
    </style>
  </defs>

  <rect width="1240" height="760" fill="white"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1c2733">PREVAIL — System Architecture</text>
  <text x="20" y="50" font-size="12" fill="#8a94a1">SIH26153 · offline temporal World Model, K-step attack-trajectory forecasting</text>

  <!-- Row 1: data pipeline -->
  <text x="20" y="90" class="section">DATA PIPELINE (Milestone 3)</text>
  <g>
    <rect class="box" x="20"  y="100" width="140" height="55"/>
    <text class="lbl" x="90" y="123">Raw Telemetry</text>
    <text class="sub" x="90" y="140">PCAP / packet-CSV</text>

    <rect class="box" x="190" y="100" width="140" height="55"/>
    <text class="lbl" x="260" y="123">Ingestion</text>
    <text class="sub" x="260" y="140">untrusted-input safe</text>

    <rect class="box" x="360" y="100" width="140" height="55"/>
    <text class="lbl" x="430" y="123">Preprocessing</text>
    <text class="sub" x="430" y="140">dedup, timestamp check</text>

    <rect class="box" x="530" y="100" width="140" height="55"/>
    <text class="lbl" x="600" y="118">Features</text>
    <text class="sub" x="600" y="133">flow · packet · temporal</text>
    <text class="sub" x="600" y="146">59 features, no labels</text>

    <rect class="box" x="700" y="100" width="140" height="55"/>
    <text class="lbl" x="770" y="123">States</text>
    <text class="sub" x="770" y="140">NetworkState per window</text>

    <rect class="box" x="870" y="100" width="140" height="55"/>
    <text class="lbl" x="940" y="118">Sequences</text>
    <text class="sub" x="940" y="133">scenario-safe, leakage</text>
    <text class="sub" x="940" y="146">checked (no random split)</text>

    <path class="edge" d="M160,127 L190,127"/>
    <path class="edge" d="M330,127 L360,127"/>
    <path class="edge" d="M500,127 L530,127"/>
    <path class="edge" d="M670,127 L700,127"/>
    <path class="edge" d="M840,127 L870,127"/>
  </g>

  <!-- Row 2: modeling -->
  <text x="20" y="205" class="section">MODELING (Milestones 4-6)</text>
  <g>
    <rect class="box" x="20" y="215" width="160" height="55"/>
    <text class="lbl" x="100" y="238">Logistic Regression</text>
    <text class="sub" x="100" y="253">Experiment A · baseline</text>

    <rect class="box-model" x="220" y="215" width="180" height="55"/>
    <text class="lbl" x="310" y="233">World Model V1</text>
    <text class="sub" x="310" y="248">causal Transformer</text>
    <text class="sub" x="310" y="260">Ŝ_t+1 = f(S_t-L..S_t)</text>

    <rect class="box-model" x="440" y="215" width="160" height="55"/>
    <text class="lbl" x="520" y="238">K-step Rollout</text>
    <text class="sub" x="520" y="253">K ∈ {1,2,3,5}, autoregressive</text>

    <rect class="box-model" x="640" y="215" width="180" height="55"/>
    <text class="lbl" x="730" y="233">Attack-Stage Classifier</text>
    <text class="sub" x="730" y="248">independent, downstream</text>
    <text class="sub" x="730" y="260">of real OR predicted states</text>

    <rect class="box" x="860" y="215" width="180" height="55"/>
    <text class="lbl" x="950" y="233">MITRE ATT&amp;CK Mapping</text>
    <text class="sub" x="950" y="248">versioned YAML, confidence-</text>
    <text class="sub" x="950" y="260">scored, hand-authored</text>

    <path class="edge" d="M940,155 L940,190 L100,190 L100,215"/>
    <path class="edge" d="M940,155 L940,190 L310,190 L310,215"/>
    <path class="edge" d="M400,242 L440,242"/>
    <path class="edge" d="M600,242 L640,242"/>
    <path class="edge" d="M820,242 L860,242"/>
  </g>

  <!-- Row 3: explainability + intervention -->
  <text x="20" y="320" class="section">INTERPRETATION &amp; PROPOSED EXTENSION (Milestones 8-9)</text>
  <g>
    <rect class="box" x="20" y="330" width="200" height="60"/>
    <text class="lbl" x="120" y="352">Explainability</text>
    <text class="sub" x="120" y="367">SHAP attribution + temporal</text>
    <text class="sub" x="120" y="379">occlusion evidence</text>

    <rect class="box-ext" x="260" y="330" width="260" height="60"/>
    <text class="lbl" x="390" y="349">What-If Intervention Simulator</text>
    <text class="sub" x="390" y="364">PROPOSED EXTENSION — not mandatory PS req.</text>
    <text class="sub" x="390" y="376">packet-level filter → re-extract → re-rollout</text>

    <rect class="box-ext" x="560" y="330" width="200" height="60"/>
    <text class="lbl" x="660" y="352">OOD Sanity Check</text>
    <text class="sub" x="660" y="367">flags counterfactual states</text>
    <text class="sub" x="660" y="379">unusual vs. training dist.</text>

    <path class="edge" d="M730,270 L730,300 L120,300 L120,330"/>
    <path class="edge" d="M730,270 L730,300 L390,300 L390,330"/>
    <path class="edge" d="M520,360 L560,360"/>
  </g>

  <!-- Row 4: evaluation -->
  <text x="20" y="435" class="section">EVALUATION (Milestone 12)</text>
  <g>
    <rect class="box" x="20" y="445" width="740" height="55"/>
    <text class="lbl" x="390" y="465">Precision · Recall · F1 · FPR · ROC-AUC/PR-AUC · error accumulation (K) · ablations (E/F/G) · generalization (J)</text>
    <text class="sub" x="390" y="482">baseline vs. World Model, every result scenario-split &amp; leakage-checked, reproducible manifests (seed/commit/config)</text>
  </g>

  <!-- Row 5: product -->
  <text x="20" y="545" class="section">PRODUCT (Milestones 10-11, 21)</text>
  <g>
    <rect class="box-product" x="20"  y="555" width="220" height="60"/>
    <text class="lbl" x="130" y="577">FastAPI Backend</text>
    <text class="sub" x="130" y="592">/forecast /rollout /intervention</text>
    <text class="sub" x="130" y="604">/explain /analyze /models</text>

    <rect class="box-product" x="270" y="555" width="220" height="60"/>
    <text class="lbl" x="380" y="577">Next.js Dashboard</text>
    <text class="sub" x="380" y="592">7 tabs: forecast, trajectory,</text>
    <text class="sub" x="380" y="604">explainability, what-if, eval</text>

    <rect class="box-product" x="520" y="555" width="240" height="60"/>
    <text class="lbl" x="640" y="577">Docker Compose</text>
    <text class="sub" x="640" y="592">offline-verified: health → load</text>
    <text class="sub" x="640" y="604">→ forecast → dashboard, no egress</text>

    <path class="edge" d="M390,500 L130,530 L130,555"/>
    <path class="edge" d="M390,500 L390,555"/>
    <path class="edge" d="M240,585 L270,585"/>
    <path class="edge" d="M490,585 L520,585"/>
  </g>

  <!-- legend -->
  <g transform="translate(800,555)">
    <rect class="box" x="0" y="0" width="16" height="16"/>
    <text x="22" y="13" font-size="11" fill="#333">core pipeline</text>
    <rect class="box-model" x="130" y="0" width="16" height="16"/>
    <text x="152" y="13" font-size="11" fill="#333">mandatory PS core</text>
    <rect class="box-ext" x="290" y="0" width="16" height="16"/>
    <text x="312" y="13" font-size="11" fill="#333">proposed extension</text>
    <rect class="box-product" x="420" y="0" width="16" height="16"/>
    <text x="442" y="13" font-size="11" fill="#333">product surface</text>
  </g>

  <text x="20" y="700" font-size="11" fill="#8a94a1">All modeling/evaluation figures elsewhere in this repo are produced on a synthetic validation dataset — see DECISIONS.md D-003 and docs/limitations.md.</text>
  <text x="20" y="718" font-size="11" fill="#8a94a1">Full module-level detail: docs/architecture/architecture.md · data contract: docs/architecture/data-contract.md · intervention spec: docs/architecture/intervention-model.md</text>
</svg>
