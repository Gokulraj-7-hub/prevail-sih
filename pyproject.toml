[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prevail"
version = "0.1.0"
description = "PREVAIL - Predictive Network Attack Trajectory & Intervention Learning (SIH26153)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "shap",
    "joblib",
    "python-multipart",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
